<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="simGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgLight)"/>

  <!-- Header -->
  <g transform="translate(60, 52)">
    <rect width="275" height="36" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#10B981"/>
    <text x="36" y="23" fill="#6EE7B7" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">KULLANIMA HAZIR TAM SET</text>
    <text x="0" y="74" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800">Eksiksiz Kutu İçeriği — Tak &amp; Çalıştır</text>
    <text x="0" y="105" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="16">Ekstra hat çıkarma, kurulum ücreti veya usta masrafı olmadan kutudan çıktığı an aktif.</text>
  </g>

  <!-- Card 1: LG-500 Pro Device -->
  <g transform="translate(60, 195)">
    <rect width="336" height="500" rx="24" fill="url(#cardSurface)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="76" height="28" rx="6" fill="#F97316" fill-opacity="0.2"/>
    <text x="62" y="43" text-anchor="middle" fill="#FB923C" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">PARÇA #1</text>

    <!-- Device Vector Illustration -->
    <g transform="translate(68, 95)">
      <rect x="10" y="10" width="180" height="225" rx="22" fill="#0B0F17" stroke="#475569" stroke-width="2.5"/>
      <rect x="26" y="26" width="148" height="193" rx="14" fill="#161F30" stroke="#334155" stroke-width="1.5"/>
      <path d="M 46 50 L 154 50 L 154 135" fill="none" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 154 195 L 46 195 L 46 110" fill="none" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="90" cy="182" r="4" fill="#10B981"/>
      <circle cx="110" cy="182" r="4" fill="#38BDF8"/>
      <rect x="2" y="65" width="10" height="75" rx="4" fill="#334155"/>
    </g>

    <text x="168" y="385" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800">LG-500 Pro Ana Ünite</text>
    <text x="168" y="415" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">6.000 mAh Bataryalı &amp; N54 Mıknatıslı</text>
    <text x="168" y="438" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">4G LTE Kablosuz GPS Takip Cihazı</text>
    <rect x="78" y="454" width="180" height="26" rx="13" fill="#10B981" fill-opacity="0.15"/>
    <text x="168" y="471" text-anchor="middle" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">✓ %100 Şarjlı Gönderilir</text>
  </g>

  <!-- Card 2: USB Type-C Cable -->
  <g transform="translate(432, 195)">
    <rect width="336" height="500" rx="24" fill="url(#cardSurface)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="76" height="28" rx="6" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="62" y="43" text-anchor="middle" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">PARÇA #2</text>

    <!-- Coiled Type-C Cable Illustration -->
    <g transform="translate(88, 100)">
      <ellipse cx="80" cy="115" rx="58" ry="88" fill="none" stroke="#334155" stroke-width="16"/>
      <ellipse cx="80" cy="115" rx="58" ry="88" fill="none" stroke="#0F172A" stroke-width="10"/>
      <ellipse cx="80" cy="115" rx="44" ry="72" fill="none" stroke="#475569" stroke-width="12"/>
      <!-- Cable Tie -->
      <rect x="18" y="105" width="124" height="16" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <!-- USB-A & Type-C Connectors -->
      <rect x="42" y="18" width="26" height="36" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
      <rect x="47" y="4" width="16" height="15" rx="2" fill="#CBD5E1"/>
      <rect x="94" y="24" width="22" height="30" rx="5" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <rect x="99" y="12" width="12" height="12" rx="3" fill="#CBD5E1"/>
    </g>

    <text x="168" y="385" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800">Type-C Şarj Kablosu</text>
    <text x="168" y="415" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">5V / 2A Akım Korumalı Hızlı Şarj</text>
    <text x="168" y="438" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">Powerbank ve Telefon Adaptörü Uyumlu</text>
    <rect x="78" y="454" width="180" height="26" rx="13" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="168" y="471" text-anchor="middle" fill="#7DD3FC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">✓ ~4.5 Saatte Tam Dolum</text>
  </g>

  <!-- Card 3: Built-in M2M SIM + App License -->
  <g transform="translate(804, 195)">
    <rect width="336" height="500" rx="24" fill="url(#cardSurface)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="24" y="24" width="120" height="28" rx="6" fill="#10B981" fill-opacity="0.2"/>
    <text x="84" y="43" text-anchor="middle" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">PARÇA #3 &amp; #4</text>

    <!-- SIM Card Illustration -->
    <g transform="translate(93, 95)">
      <path d="M 20 10 L 110 10 L 140 40 L 140 195 C 140 206 131 215 120 215 L 20 215 C 9 215 0 206 0 195 L 0 30 C 0 19 9 10 20 10 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
      <!-- Gold Chip -->
      <rect x="35" y="75" width="70" height="82" rx="10" fill="url(#simGold)" stroke="#A16207" stroke-width="2"/>
      <line x1="58" y1="75" x2="58" y2="157" stroke="#A16207" stroke-width="2"/>
      <line x1="82" y1="75" x2="82" y2="157" stroke="#A16207" stroke-width="2"/>
      <line x1="35" y1="102" x2="105" y2="102" stroke="#A16207" stroke-width="2"/>
      <line x1="35" y1="130" x2="105" y2="130" stroke="#A16207" stroke-width="2"/>
      <text x="70" y="48" text-anchor="middle" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="900">4G M2M DATA</text>
      <text x="70" y="190" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11" font-weight="700">AKTİF &amp; TANIMLI</text>
    </g>

    <text x="168" y="385" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800">M2M SIM Kart &amp; Mobil Panel</text>
    <text x="168" y="415" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">Cihaz İçine Takılı M2M Data Hattı +</text>
    <text x="168" y="438" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">12 Ay Ücretsiz iOS / Android / Web Panel</text>
    <rect x="64" y="454" width="208" height="26" rx="13" fill="#10B981" fill-opacity="0.2"/>
    <text x="168" y="471" text-anchor="middle" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">✓ Taahhüt Yok • Fatura Sürprizi Yok</text>
  </g>

  <!-- Bottom Guarantee Strip -->
  <g transform="translate(60, 735)">
    <rect width="1080" height="105" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="540" y="44" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800">📦 Türkçe Kurulum Kılavuzu + 2 Yıl Resmi LifeGo Mobil Garanti Belgesi Kutuya Dahildir</text>
    <text x="540" y="74" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">Siparişiniz kargoya verilmeden önce teknik ekibimiz tarafından SIM aktivasyonu ve uydu testi yapılarak hazır gönderilir.</text>
  </g>
</svg>
